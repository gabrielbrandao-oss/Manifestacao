# Design System Cobli — modo Light (tokens --primary, --background, --muted, --foreground)
[theme]
base = "light"
primaryColor = "#001BB8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#020231"
# Geist é carregada via CSS (Google Fonts) no app.py; aqui vale também para a tabela
font = "Geist, sans-serif"
codeFont = "Geist Mono, monospace"
baseRadius = "8px"
borderColor = "#E4E4E7"
